name: macOS build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test camera planning
        run: swift run CameraTests
      - name: Build app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Screen-Recorder-macOS
          path: dist/Screen-Recorder-macOS.zip
